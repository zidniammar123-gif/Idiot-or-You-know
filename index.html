<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Halaman</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 460px;
            width: 100%;
        }

        h1 {
            color: #2ecc71;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .deskripsi {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin: -5px 0 20px;
        }

        .btn-klik {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-klik:hover {
            background-color: #c0392b;
        }

        .comments-section {
            margin-top: 30px;
            text-align: left;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .comment-toggle {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .comment-toggle:hover {
            background-color: #7f8c8d;
        }

        #comment-content {
            display: block;
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .comment-form input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 14px;
        }

        .comment-form button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .comment-form button:hover {
            background-color: #2980b9;
        }

        .comment {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
            border-left: 4px solid #2ecc71;
            animation: fadeIn 0.5s ease-in-out;
            line-height: 1.4;
        }

        .reply-comment {
            background: #f0fdf4;
            margin-left: 20px;
            border-left: 4px solid #3498db;
        }

        /* TOMBOL REPORT SAMPING */
        .report-button {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 12px 10px;
            border-radius: 8px 0 0 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .report-button:hover {
            background-color: #636e72;
        }

        /* PANEL REPORT DARI SAMPING */
        .admin-panel {
            position: fixed;
            top: 0;
            right: -380px;
            width: 340px;
            max-width: 85%;
            height: 100%;
            background: white;
            box-shadow: -4px 0 12px rgba(0,0,0,0.2);
            z-index: 2000;
            transition: right 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .admin-panel.open {
            right: 0;
        }

        /* KOTAK X */
        .admin-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 5px;
            background-color: #e74c3c;
            color: white;
            font-size: 24px;
            line-height: 30px;
            cursor: pointer;
        }

        .admin-close:hover {
            background-color: #c0392b;
        }

        .admin-title {
            font-weight: bold;
            color: #2c3e50;
            font-size: 20px;
            margin: 10px 45px 15px 0;
        }

        .admin-chat {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .admin-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .admin-send {
            width: 100%;
            padding: 10px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-send:hover {
            background-color: #2c3e50;
        }

        .disclaimer-admin {
            background: #fff3cd;
            border-left: 4px solid #f39c12;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            color: #6b4f00;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Duit Gratis 26JT</h1>

    <p class="deskripsi">
        🎉 ini untuk memperingati pergantian 
         tahun dari 2026-2027 jika anda nemu ini
        selamat anda akan dapat duit klaim sebelum 
        ditutup.
    </p>

    <button class="btn-klik" onclick="bukaYouTube()">
        Cepat Klik
    </button>


    <div class="comments-section">

        <h3>Komentar Terbaru</h3>

        <!-- TOMBOL TUTUP / BUKA KOMENTAR -->
        <button
            class="comment-toggle"
            id="comment-toggle"
            onclick="toggleKomentar()">
            Tutup Komentar
        </button>

        <div id="comment-content">

            <div class="comment-form">

                <input
                    type="email"
                    id="user-email"
                    placeholder="Masukkan Email Anda (contoh: budi@gmail.com)"
                    required
                >

                <input
                    type="text"
                    id="user-comment"
                    placeholder="Tulis komentar Anda..."
                >

                <button onclick="kirimKomentarManual()">
                    Kirim Komentar
                </button>

            </div>

            <div id="comment-box">
                <!-- Komentar otomatis & manual muncul di sini -->
            </div>

        </div>

    </div>

</div>


<!-- TOMBOL REPORT DI SAMPING -->
<button class="report-button" onclick="bukaAdmin()">
    💬 Admin
</button>


<!-- PANEL REPORT / ADMIN -->
<div class="admin-panel" id="admin-panel">

    <!-- KOTAK X -->
    <button class="admin-close" onclick="tutupAdmin()">
        ×
    </button>

    <div class="admin-title">
        👤 [ADMIN]
    </div>

    <div class="admin-chat" id="admin-chat">
        Halo! Ini ruang komunikasi admin.
        Silakan tulis pesan atau pertanyaan Anda.
    </div>

    <input
        type="text"
        id="admin-input"
        class="admin-input"
        placeholder="Tulis pesan ke admin..."
    >

    <button class="admin-send" onclick="kirimKeAdmin()">
        Kirim ke Admin
    </button>

</div>


<script>

    // Komentar berkala dari bot umum
    const daftarKomentar = [
        "Wah beneran masuk rekening langsung gokil!",
        "Awalnya ragu, pas dicoba ternyata langsung cair 26jt.",
        "Mantap banget, prosesnya cepet banget ga pake ribet.",
        "Terima kasih admin, saldo saya langsung bertambah!",
        "Gila sih ini, temen gua juga barusan dapet.",
        "Beneran riil no tipu-tipu, langsung klik aja guys.",
        "Gak nyangka hari ini dapet rezeki nomplok wkwk.",
        "Sumpah ini legal kan? Tapi duitnya beneran masuk sih, makasih!",
        "Anjay dapet beneran dong, untung iseng nyoba pas lewat fyp",
        "Alhamdulillah bisa buat bayar kontrakan wkwk mantap maseh"
    ];

    const daftarNama = [
        "budi_santoso",
        "siti99",
        "rian_hidayat92",
        "dewi.lestari",
        "andiwijaya",
        "riska_amalia",
        "fahmi_07",
        "megaputri_id",
        "eko_purnomo",
        "nina_marina"
    ];

    const daftarBalasanMembela = [
        "Yeee dibilang hoax, lu aja kali yang telat klik atau ga ngikutin caranya bener-bener.",
        "Lah palsu gimana? Temen gua sendiri udah cair masuk ke e-wallet kok.",
        "Syirik aja lu bang, mending buruan coba sendiri daripada rugi ga kebagian.",
        "Bukan hoax bro, ini emang event resmi terbatas makanya buruan klik.",
        "Gua juga awalnya mikir gitu, pas nekat nyoba malah beneran cair wkwk. Coba dulu makanya.",
        "Kebanyakan mikir lu wkwk keburu hangus ntar slotnya baru nangis.",
        "Gak usah dengerin yang billing palsu guys, gua barusan cek m-banking udah landing kok."
    ];

    const daftarBalasanMenyemangati = [
        "Aamiin bang, lgsg klik aja tombol di atas mumpung kuotanya masih ada!",
        "Pasti berhasil kak! Yg penting ikutin jalurnya aja jgn ampe kelewatan.",
        "Gas terus bro moga lancar cairnya, rezeki ga kemana wkwk",
        "Semangattt! Gua kemaren doa gitu juga alhamdulillah tembus langsung.",
        "Bismillah moga dapet ya gan, jgn lupa buruan di-klik tombol merahnya.",
        "Semoga beruntung bro, asalkan gercep pasti kebagian kok!",
        "Aamiinn ya Allah, gas keun mumpung masih anget websitenya."
    ];


    function tambahKomentarAcak() {

        const commentBox =
            document.getElementById('comment-box');

        const namaAcak =
            daftarNama[
                Math.floor(
                    Math.random() * daftarNama.length
                )
            ];

        const teksAcak =
            daftarKomentar[
                Math.floor(
                    Math.random() * daftarKomentar.length
                )
            ];

        const elemenKomentar =
            document.createElement('div');

        elemenKomentar.className = 'comment';

        elemenKomentar.innerHTML =
            `<strong>@${namaAcak}:</strong> ${teksAcak}`;

        commentBox.insertBefore(
            elemenKomentar,
            commentBox.firstChild
        );

        batasiJumlahKomentar();
    }


    function kirimKomentarManual() {

        const emailInput =
            document.getElementById('user-email');

        const commentInput =
            document.getElementById('user-comment');

        const email =
            emailInput.value.trim();

        const text =
            commentInput.value.trim();

        if (email === "" || text === "") {

            alert(
                "Harap isi email dan komentar terlebih dahulu!"
            );

            return;
        }

        let namaUser =
            email.split('@')[0];

        namaUser =
            namaUser
            .replace(/[^a-zA-Z0-9_.]/g, '')
            .substring(0, 15);

        const commentBox =
            document.getElementById('comment-box');

        const elemenKomentarUser =
            document.createElement('div');

        elemenKomentarUser.className =
            'comment';

        elemenKomentarUser.style.borderLeftColor =
            '#34495e';

        elemenKomentarUser.innerHTML =
            `<strong>@${namaUser}:</strong> ${text}`;

        commentBox.insertBefore(
            elemenKomentarUser,
            commentBox.firstChild
        );

        commentInput.value = "";

        batasiJumlahKomentar();

        const textLower =
            text.toLowerCase();

        const kataKunciNegatif = [
            'hoax',
            'palsu',
            'bohong',
            'tipu',
            'scam',
            'fake',
            'boong'
        ];

        const mengandungNegatif =
            kataKunciNegatif.some(
                kata => textLower.includes(kata)
            );

        const kataKunciHarapan = [
            'bismillah',
            'semoga',
            'plis',
            'berhasil',
            'moga',
            'mudah-mudahan',
            'wish'
        ];

        const mengandungHarapan =
            kataKunciHarapan.some(
                kata => textLower.includes(kata)
            );

        if (mengandungNegatif) {

            prosesBalasanOtomatis(
                namaUser,
                elemenKomentarUser,
                daftarBalasanMembela
            );

        } else if (mengandungHarapan) {

            prosesBalasanOtomatis(
                namaUser,
                elemenKomentarUser,
                daftarBalasanMenyemangati
            );
        }

        balasanAdminDariKomentar(text);
    }


    function prosesBalasanOtomatis(
        namaTarget,
        elemenTarget,
        kumpulanPesan
    ) {

        setTimeout(() => {

            const commentBox =
                document.getElementById('comment-box');

            const namaPembas =
                daftarNama[
                    Math.floor(
                        Math.random() * daftarNama.length
                    )
                ];

            const pesanAcak =
                kumpulanPesan[
                    Math.floor(
                        Math.random() * kumpulanPesan.length
                    )
                ];

            const elemenBalasan =
                document.createElement('div');

            elemenBalasan.className =
                'comment reply-comment';

            elemenBalasan.innerHTML =
                `<strong>@${namaPembas} (Membalas @${namaTarget}):</strong> ${pesanAcak}`;

            commentBox.insertBefore(
                elemenBalasan,
                elemenTarget
            );

            batasiJumlahKomentar();

        }, 1200);
    }


    function batasiJumlahKomentar() {

        const commentBox =
            document.getElementById('comment-box');

        if (commentBox.children.length > 12) {

            commentBox.removeChild(
                commentBox.lastChild
            );
        }
    }


    // ==============================
    // BUKA / TUTUP KOMENTAR
    // ==============================

    function toggleKomentar() {

        const content =
            document.getElementById('comment-content');

        const button =
            document.getElementById('comment-toggle');

        if (content.style.display === 'none') {

            content.style.display = 'block';

            button.textContent =
                'Tutup Komentar';

        } else {

            content.style.display = 'none';

            button.textContent =
                'Buka Komentar';
        }
    }


    // ==============================
    // REPORT / ADMIN SAMPING
    // ==============================

    function bukaAdmin() {

        const panel =
            document.getElementById('admin-panel');

        panel.classList.add('open');
    }


    function tutupAdmin() {

        const panel =
            document.getElementById('admin-panel');

        panel.classList.remove('open');
    }


    // ==============================
    // CHAT ADMIN SIMULASI
    // ==============================

    function kirimKeAdmin() {

        const input =
            document.getElementById('admin-input');

        const chat =
            document.getElementById('admin-chat');

        const text =
            input.value.trim();

        if (text === "") {

            alert(
                "Tulis pesan terlebih dahulu!"
            );

            return;
        }

        const pesanUser =
            document.createElement('div');

        pesanUser.style.marginTop =
            "10px";

        pesanUser.innerHTML =
            `<strong>Anda:</strong> ${text}`;

        chat.appendChild(
            pesanUser
        );

        input.value = "";


        setTimeout(() => {

            const balasan =
                document.createElement('div');

            balasan.style.marginTop =
                "10px";

            balasan.style.paddingTop =
                "10px";

            balasan.style.borderTop =
                "1px solid #ddd";

            const textLower =
                text.toLowerCase();

            const kataNegatif = [
                "hoax",
                "palsu",
                "bohong",
                "tipu",
                "scam",
                "fake",
                "penipuan"
            ];

            const negatif =
                kataNegatif.some(
                    kata => textLower.includes(kata)
                );


            if (negatif) {

                balasan.innerHTML = `
                    <strong>[ADMIN]:</strong>

                    <div class="disclaimer-admin">
                        ⚠️ SURAT DISCLAIMER ⚠️<br><br>

                        Pernyataan atau komentar mengenai
                        hadiah, uang, atau pencairan pada
                        halaman ini hanyalah bagian dari
                        simulasi latihan.

                        <br><br>

                        Jangan memberikan data pribadi,
                        melakukan pembayaran, atau mengikuti
                        instruksi dari website yang tidak jelas.

                        <br><br>

                        Simulasi ini dibuat untuk melatih
                        kemampuan mengenali pola website
                        yang dapat terlihat meyakinkan.
                    </div>
                `;

            } else {

                balasan.innerHTML = `
                    <strong>[ADMIN]:</strong>
                    Ya, tentu😀. Silakan mengeklaimnya
                    <b>sedang give away pastikan Anda dapat</b>.
                    , semoga anda ikut keterima saat transaksi 
                    report jika ada yang gak beres.
                `;
            }

            chat.appendChild(
                balasan
            );

            chat.scrollTop =
                chat.scrollHeight;

        }, 1000);
    }


    // ADMIN MENANGGAPI KOMENTAR
    function balasanAdminDariKomentar(text) {

        const textLower =
            text.toLowerCase();

        const kataNegatif = [
            "hoax",
            "palsu",
            "bohong",
            "tipu",
            "scam",
            "fake",
            "penipuan"
        ];

        const negatif =
            kataNegatif.some(
                kata => textLower.includes(kata)
            );


        setTimeout(() => {
            
            const commentBox =
                document.getElementById('comment-box');

            const adminComment =
                document.createElement('div');

            adminComment.className =
                'comment reply-comment';


            if (negatif) {

                adminComment.innerHTML = `
                    <strong>[ADMIN SIMULASI]:</strong>

                    <div class="disclaimer-admin">
                        ⚠️ Disclaimer:

                        komentar dan hadiah pada halaman ini
                        hanya simulasi untuk latihan mengenali
                        website yang tampak meyakinkan.

                        Jangan menganggap klaim hadiah ini nyata.
                    </div>
                `;

            } else {

                adminComment.innerHTML = `
                    <strong>[ADMIN SIMULASI]:</strong>
                    Ya, tentu. Silakan mengeklaimnya
                    <b>dalam simulasi ini</b>.
                    Tidak ada uang nyata yang diberikan.
                `;
            }


            commentBox.insertBefore(
                adminComment,
                commentBox.firstChild
            );

            batasiJumlahKomentar();

        }, 1500);
    }


    function bukaYouTube() {

        window.location.href =
            "https://youtube.com";
    }


    setInterval(
        tambahKomentarAcak,
        4000
    );

    tambahKomentarAcak();

</script>

</body>
</html>
